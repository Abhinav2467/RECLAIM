services:
  postgres:
    image: postgres:18.6
    container_name: reclaim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reclaim
      POSTGRES_USER: reclaim
      POSTGRES_PASSWORD: reclaim
    ports:
      - "5432:5432"
    volumes:
      - reclaim_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaim -d reclaim"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reclaim_pgdata:
